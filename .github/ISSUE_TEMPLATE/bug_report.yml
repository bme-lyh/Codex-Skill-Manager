name: 问题报告 / Bug report
description: 报告可复现的功能或界面问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先移除 Token、Cookie、私有仓库内容和个人 Skill 正文。安全漏洞请使用私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.5.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本与安装方式
      placeholder: Windows 11 24H2，便携版
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用最少、明确的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交凭据、Cookie、私有 Skill 内容或其他敏感数据。
          required: true
