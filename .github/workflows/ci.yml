name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check Go formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            $unformatted
            throw "Go files are not formatted"
          }

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Validate bundled Agent Skill
        run: go run ./cmd/skill-validator ./skills/codex-skill-manager

      - name: Test and build release binaries
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Package release-ready artifacts
        shell: pwsh
        run: |
          $project = Get-Content -LiteralPath "wails.json" -Raw | ConvertFrom-Json
          $version = [string]$project.info.productVersion
          .\scripts\package-release.ps1 -Version $version -OutputRoot ".\build\ci-release"

      - name: Upload unsigned release-ready Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CodexSkillManager-windows-amd64-unsigned
          path: |
            build/ci-release
            build/bin/build-manifest.json
          if-no-files-found: error
          retention-days: 14
